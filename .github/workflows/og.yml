name: build-og
on:
  push:
    paths:
      - 'og.b64'
      - '.github/workflows/og.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: base64 -d og.b64 > og.jpg
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add og.jpg
          git diff --cached --quiet || git commit -m "add og image"
          git push
